# Dokploy "Compose" service.
#
# Routing + TLS are handled by Dokploy's Traefik reverse proxy via the labels
# below. The container joins Dokploy's shared `dokploy-network` so Traefik can
# reach it — no host ports are published; Traefik proxies to port 80 over that
# network.
#
# The Traefik labels assume Dokploy's default proxy setup:
#   entrypoints:  web (:80), websecure (:443)
#   certresolver: letsencrypt
# If your Dokploy Traefik uses different names, adjust them (or remove the
# labels and add the domain through Dokploy's UI, which injects its own labels).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # HTTPS router
      - traefik.http.routers.0xspryon-web.rule=Host(`0xspryon.work`) || Host(`www.0xspryon.work`)
      - traefik.http.routers.0xspryon-web.entrypoints=websecure
      - traefik.http.routers.0xspryon-web.tls=true
      - traefik.http.routers.0xspryon-web.tls.certresolver=letsencrypt
      - traefik.http.services.0xspryon-web.loadbalancer.server.port=80

      # HTTP router → redirect to HTTPS
      - traefik.http.routers.0xspryon-web-http.rule=Host(`0xspryon.work`) || Host(`www.0xspryon.work`)
      - traefik.http.routers.0xspryon-web-http.entrypoints=web
      - traefik.http.routers.0xspryon-web-http.middlewares=0xspryon-web-redirect
      - traefik.http.middlewares.0xspryon-web-redirect.redirectscheme.scheme=https

      # halfabit.work (legacy domain) → permanent redirect to 0xspryon.work.
      # Path and query string are preserved. Requires halfabit.work (and www)
      # to have DNS A/AAAA records pointing at this host so letsencrypt can
      # issue a cert for the HTTPS router.
      - traefik.http.middlewares.halfabit-to-0xspryon.redirectregex.regex=^https?://(?:www\.)?halfabit\.work/(.*)
      - traefik.http.middlewares.halfabit-to-0xspryon.redirectregex.replacement=https://0xspryon.work/$${1}
      - traefik.http.middlewares.halfabit-to-0xspryon.redirectregex.permanent=true

      - traefik.http.routers.halfabit-redirect.rule=Host(`halfabit.work`) || Host(`www.halfabit.work`)
      - traefik.http.routers.halfabit-redirect.entrypoints=websecure
      - traefik.http.routers.halfabit-redirect.tls=true
      - traefik.http.routers.halfabit-redirect.tls.certresolver=letsencrypt
      - traefik.http.routers.halfabit-redirect.middlewares=halfabit-to-0xspryon
      - traefik.http.routers.halfabit-redirect.service=0xspryon-web

      - traefik.http.routers.halfabit-redirect-http.rule=Host(`halfabit.work`) || Host(`www.halfabit.work`)
      - traefik.http.routers.halfabit-redirect-http.entrypoints=web
      - traefik.http.routers.halfabit-redirect-http.middlewares=halfabit-to-0xspryon
      - traefik.http.routers.halfabit-redirect-http.service=0xspryon-web

networks:
  dokploy-network:
    external: true
